apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: APP_NAME
resources:
  - namespace.yaml
  - ../../base
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
  # Public services: pick one.
  # - httproute.yaml   # Gateway API (preferred)
  # - ingress.yaml     # if the cluster only has an Ingress controller
# Base labels don't reach overlay-only resources (PDB, HPA, policies); repeat them.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: APP_NAME
      app.kubernetes.io/managed-by: k8s-anything
images:
  - name: APP_NAME
    newName: REGISTRY/APP_NAME
    newTag: "0.1.0"   # pin a release tag, ideally also `digest: sha256:...`; never latest
patches:
  - path: deployment-prod.yaml
