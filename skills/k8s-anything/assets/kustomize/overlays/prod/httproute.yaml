# Gateway API route. Requires a Gateway in the cluster; set its name/namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: APP_NAME
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
  hostnames:
    - APP_NAME.example.com
  rules:
    - backendRefs:
        - name: APP_NAME
          port: 80
