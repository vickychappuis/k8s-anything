# Default-deny ingress for the namespace, then allow the app port from:
#  - pods in this namespace
#  - the namespace of your Gateway / Ingress controller (adjust the name)
# Add more peers from the dependency graph found in Discover.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: APP_NAME-allow-http
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: APP_NAME
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
      ports:
        - port: http
