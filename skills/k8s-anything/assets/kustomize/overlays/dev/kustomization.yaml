apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: APP_NAME-dev
resources:
  - namespace.yaml
  - ../../base
  # Dev-only backing services (e.g. redis.yaml, postgres.yaml) go here, never in base.
images:
  - name: APP_NAME
    newTag: dev
configMapGenerator:
  - name: APP_NAME-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
# Dev secrets: obviously fake values only. Prod creates the Secret out-of-band.
# secretGenerator:
#   - name: APP_NAME-secrets
#     literals:
#       - EXAMPLE_API_KEY=dev-not-a-secret
