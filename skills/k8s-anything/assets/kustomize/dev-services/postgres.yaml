# Dev-only PostgreSQL (StatefulSet + PVC). Never in base or prod: prod uses a managed
# Postgres and points the app at it via config.
#
# Wire it in: copy to overlays/dev/postgres.yaml and add to overlays/dev/kustomization.yaml:
#   resources:
#     - postgres.yaml
#   secretGenerator:            # obviously fake dev values only
#     - name: postgres-credentials
#       literals:
#         - POSTGRES_USER=app
#         - POSTGRES_PASSWORD=dev-not-a-secret
#         - POSTGRES_DB=app
# App env (put the URL in the app's dev secretGenerator, not in base):
#   DATABASE_URL=postgresql://app:dev-not-a-secret@postgres:5432/app
#
# Runs as the official image's postgres user (999) under Pod Security "restricted" with
# a read-only root filesystem; PGDATA is a subdirectory of the volume so a lost+found
# at the volume root doesn't break initdb. Verified with:
#   docker run --read-only --tmpfs /var/run/postgresql:uid=999,gid=999 \
#     --tmpfs /tmp:uid=999,gid=999 -v pgdata:/var/lib/postgresql/data \
#     --user 999:999 --cap-drop ALL --security-opt no-new-privileges \
#     -e POSTGRES_USER=app -e POSTGRES_PASSWORD=dev-not-a-secret -e POSTGRES_DB=app \
#     -e PGDATA=/var/lib/postgresql/data/pgdata postgres:17.11
# and on kind in a namespace labelled pod-security.kubernetes.io/enforce=restricted:
#   kubectl exec postgres-0 -- sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1"'
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Pin a patch release; match the major version the app used before.
          image: postgres:17.11
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          # TCP (not the socket): during first-boot init the entrypoint runs a temporary
          # server on the socket only, so this stays not-ready until the real one is up.
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 5
          # First boot runs the image's init (temporary server, not on the pod IP),
          # which can take minutes on a slow node: allow up to 5 min before liveness.
          startupProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
