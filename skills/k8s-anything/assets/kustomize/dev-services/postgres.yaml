# Dev-only Postgres (StatefulSet + PVC). Copy to overlays/dev/postgres.yaml, list it
# in overlays/dev/kustomization.yaml, and add to the same overlay:
#   secretGenerator:
#     - name: postgres-dev
#       literals:
#         - POSTGRES_PASSWORD=dev-not-a-secret
# The app then uses postgres://app:dev-not-a-secret@postgres:5432/app.
# Never in base or prod: prod uses a managed Postgres via the app's own config.
# Runs as the official image's postgres user (999) under Pod Security "restricted";
# verified with: docker run --read-only --user 999:999 --cap-drop ALL
#   --tmpfs /var/run/postgresql --tmpfs /tmp --tmpfs /var/lib/postgresql/data
#   -e PGDATA=/var/lib/postgresql/data/pgdata postgres:16.6
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Pin a patch release; match the major version the app uses in prod.
          image: postgres:16.6
          env:
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_DB
              value: app
            # Read from a mounted file, not an env var (kube-linter read-secret-from-env-var).
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/postgres-dev/POSTGRES_PASSWORD
            # A subdirectory: the volume root may hold lost+found, which initdb rejects.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "app", "-h", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: password
              mountPath: /etc/postgres-dev
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: password
          secret:
            secretName: postgres-dev
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
