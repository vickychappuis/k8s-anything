# Dev-only RabbitMQ, single node (StatefulSet + PVC). Never in base or prod: prod uses a
# managed broker (or the RabbitMQ Cluster Operator) and points the app at it via config.
#
# Wire it in: copy to overlays/dev/rabbitmq.yaml, then merge into the EXISTING keys of
# overlays/dev/kustomization.yaml (a second `resources:` key silently replaces the
# first, dropping ../../base):
#   resources:
#     - namespace.yaml          # already there
#     - ../../base              # already there
#     - rabbitmq.yaml
#   secretGenerator:            # one list for all dev secrets; obviously fake values only
#     - name: rabbitmq-credentials
#       literals:
#         - RABBITMQ_DEFAULT_USER=app
#         - RABBITMQ_DEFAULT_PASS=dev-not-a-secret
# App env (put the URL in the app's dev secretGenerator, not in base):
#   AMQP_URL=amqp://app:dev-not-a-secret@rabbitmq:5672/   (Celery: CELERY_BROKER_URL)
#
# Runs as the official image's rabbitmq user (999) under Pod Security "restricted" with
# a read-only root filesystem. The Erlang cookie and Mnesia data live on the volume
# (HOME=/var/lib/rabbitmq), so CLI tools in probes/exec work. Verified with:
#   docker run --read-only --tmpfs /tmp:uid=999,gid=999 \
#     --tmpfs /var/log/rabbitmq:uid=999,gid=999 -v rabbitdata:/var/lib/rabbitmq \
#     --user 999:999 --cap-drop ALL --security-opt no-new-privileges \
#     -e RABBITMQ_DEFAULT_USER=app -e RABBITMQ_DEFAULT_PASS=dev-not-a-secret rabbitmq:4.3.7
# and on kind in a namespace labelled pod-security.kubernetes.io/enforce=restricted:
#   kubectl exec rabbitmq-0 -- rabbitmq-diagnostics -q ping
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: broker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: broker
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: broker
    spec:
      serviceAccountName: rabbitmq
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          # Pin a patch release; match the major version the app used before.
          image: rabbitmq:4.3.7
          envFrom:
            - secretRef:
                name: rabbitmq-credentials
          ports:
            - name: amqp
              containerPort: 5672
          # The CLI starts an Erlang VM (~1-2 s), hence the generous timeout.
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 20
            timeoutSeconds: 15
          # Boot (Erlang VM, Mnesia, plugins) can take a minute or more on a slow node:
          # allow up to 5 min before liveness starts.
          startupProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: log
              mountPath: /var/log/rabbitmq
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: log
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
