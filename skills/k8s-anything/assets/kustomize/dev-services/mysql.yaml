# Dev-only MySQL (StatefulSet + PVC). Never in base or prod: prod uses a managed MySQL
# and points the app at it via config.
#
# Wire it in: copy to overlays/dev/mysql.yaml and add to overlays/dev/kustomization.yaml:
#   resources:
#     - mysql.yaml
#   secretGenerator:            # obviously fake dev values only
#     - name: mysql-credentials
#       literals:
#         - MYSQL_ROOT_PASSWORD=dev-root-not-a-secret
#         - MYSQL_USER=app
#         - MYSQL_PASSWORD=dev-not-a-secret
#         - MYSQL_DATABASE=app
# App env (put the URL in the app's dev secretGenerator, not in base; scheme depends on
# the driver, e.g. mysql:// or mysql+pymysql://):
#   DATABASE_URL=mysql://app:dev-not-a-secret@mysql:3306/app
#
# Runs as the official image's mysql user (999) under Pod Security "restricted" with a
# read-only root filesystem; --datadir is a subdirectory of the volume so a lost+found
# at the volume root doesn't break initialization. Verified with:
#   docker run --read-only --tmpfs /var/run/mysqld:uid=999,gid=999 \
#     --tmpfs /tmp:uid=999,gid=999 -v mysqldata:/var/lib/mysql \
#     --user 999:999 --cap-drop ALL --security-opt no-new-privileges \
#     -e MYSQL_ROOT_PASSWORD=dev-root-not-a-secret -e MYSQL_USER=app \
#     -e MYSQL_PASSWORD=dev-not-a-secret -e MYSQL_DATABASE=app \
#     mysql:8.4.13 mysqld --datadir=/var/lib/mysql/data
# and on kind in a namespace labelled pod-security.kubernetes.io/enforce=restricted:
#   kubectl exec mysql-0 -- sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -NBe "SELECT 1"'
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: mysql
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          # Pin a patch release; match the major version the app used before.
          image: mysql:8.4.13
          args: ["mysqld", "--datadir=/var/lib/mysql/data"]
          envFrom:
            - secretRef:
                name: mysql-credentials
          ports:
            - name: mysql
              containerPort: 3306
          # TCP (not the socket): first-boot init runs a temporary server with
          # --skip-networking, so this stays not-ready until the real one is up.
          # mysqladmin ping exits 0 even on access denied, so no password is needed.
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            periodSeconds: 10
            timeoutSeconds: 5
          # First boot runs the image's init (temporary server, not on the pod IP),
          # which can take minutes on a slow node: allow up to 5 min before liveness.
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /var/run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
