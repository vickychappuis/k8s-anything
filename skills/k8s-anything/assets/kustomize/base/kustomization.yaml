# Placeholders: APP_NAME, APP_PORT, HEALTH_PATH (filled by k8sa-scaffold).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Selectors are explicit in each resource (app.kubernetes.io/name) and never touched
# by these common labels: selectors are immutable, so changing a label here later
# must not break `kubectl apply`.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: APP_NAME
      app.kubernetes.io/managed-by: k8s-anything
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: APP_NAME-config
    literals:
      - LOG_LEVEL=info
# secret.example.yaml is NOT listed: in prod, create the Secret out-of-band;
# in dev, use a secretGenerator with fake values in overlays/dev.
