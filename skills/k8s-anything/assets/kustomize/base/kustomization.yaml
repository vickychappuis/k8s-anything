# Placeholders: APP_NAME, APP_PORT, HEALTH_PATH. Replace all before use.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Selectors are explicit in each resource (app.kubernetes.io/name), so labels here
# never touch selectors — that keeps the namespace-wide default-deny policy intact.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: APP_NAME
      app.kubernetes.io/managed-by: k8s-anything
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: APP_NAME-config
    literals:
      - LOG_LEVEL=info
# secret.example.yaml is NOT listed: populate the real Secret out-of-band.
