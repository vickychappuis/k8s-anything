# kube-linter config used by k8sa-validate.
# Default checks + curated extras. Not addAllBuiltIn: several built-ins are opinions
# that don't fit every app (3+ replicas, node affinity, DNSConfig).
checks:
  include:
    - latest-tag
    - liveness-port
    - readiness-port
    - startup-port
    - no-readiness-probe
    - no-rolling-update-strategy
    - pdb-unhealthy-pod-eviction-policy
    - pdb-min-available
    - pdb-max-unavailable
    - dangling-horizontalpodautoscaler
    - dangling-networkpolicy
    - dangling-networkpolicypeer-podselector
    - drop-net-raw-capability
    - privileged-ports
    - sensitive-host-mounts
    - env-var-secret
    - read-secret-from-env-var
  exclude:
    # Replaced by cpu-request below: CPU *limits* are omitted on purpose (throttling).
    - unset-cpu-requirements
    # Prod spreads replicas with topologySpreadConstraints instead of anti-affinity.
    - no-anti-affinity
customChecks:
  - name: cpu-request
    description: Every container must request CPU (limits are optional).
    remediation: Set resources.requests.cpu.
    template: cpu-requirements
    params:
      requirementsType: request
      lowerBoundMillis: 0
      upperBoundMillis: 0
