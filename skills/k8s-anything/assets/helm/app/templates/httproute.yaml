{{- if and .Values.httpRoute.enabled .Values.ingress.enabled }}
{{- fail "enable at most one of httpRoute and ingress" }}
{{- end }}
{{- if .Values.httpRoute.enabled }}
# Gateway API route. Requires the Gateway API CRDs and a Gateway (parentRefs).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "APP_NAME.fullname" . }}
  labels:
    {{- include "APP_NAME.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "APP_NAME.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
