{{- if .Values.networkPolicy.enabled }}
{{- if .Values.networkPolicy.defaultDenyIngress }}
# Default-deny ingress for the whole namespace; the policy below re-opens the app port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "APP_NAME.fullname" . }}-default-deny-ingress
  labels:
    {{- include "APP_NAME.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "APP_NAME.fullname" . }}-allow-http
  labels:
    {{- include "APP_NAME.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "APP_NAME.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
{{- end }}
