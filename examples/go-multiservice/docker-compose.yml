# Deliberately naive compose file: test input for the k8s-anything pipeline.
services:
  api:
    build:
      context: .
      args:
        MAIN: ./cmd/api
    # Migrations run on every api start, before the server.
    command: ["sh", "-c", "/app migrate && exec /app"]
    ports:
      - "9090:9090"
    environment:
      PORT: "9090"
      DATABASE_URL: postgres://app:s3cret-pw@postgres:5432/app?sslmode=disable
    depends_on:
      - postgres
  worker:
    build:
      context: .
      args:
        MAIN: ./cmd/worker
    environment:
      DATABASE_URL: postgres://app:s3cret-pw@postgres:5432/app?sslmode=disable
      POLL_INTERVAL: 2s
      LOG_LEVEL: debug
    depends_on:
      - postgres
      - api
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: s3cret-pw
      POSTGRES_DB: app
    volumes:
      - pg-data:/var/lib/postgresql/data
volumes:
  pg-data:
