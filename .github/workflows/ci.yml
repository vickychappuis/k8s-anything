name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform and kube-linter
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          curl -sSL https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz | tar xz -C /usr/local/bin kube-linter
      - name: Scaffold template with sample values
        run: ./scripts/scaffold.sh "$RUNNER_TEMP/demo" demo 8080 /healthz
      - name: Validate rendered overlays
        run: ./scripts/validate.sh "$RUNNER_TEMP/demo"
      - name: detect.sh on example emits valid JSON
        run: ./scripts/detect.sh examples/flask-redis | python3 -m json.tool
