# Gateway API route. Requires a Gateway in the cluster; set its name/namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextjs-app
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
  hostnames:
    - nextjs-app.example.com
  rules:
    - backendRefs:
        - name: nextjs-app
          port: 80
