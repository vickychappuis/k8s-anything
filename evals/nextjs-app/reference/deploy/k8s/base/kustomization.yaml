# Generated by k8sa-scaffold (app=nextjs-app port=3000 health=/api/health), then polished.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Selectors are explicit in each resource (app.kubernetes.io/name) and never touched
# by these common labels: selectors are immutable, so changing a label here later
# must not break `kubectl apply`.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: nextjs-app
      app.kubernetes.io/managed-by: k8s-anything
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
# Runtime config only. NEXT_PUBLIC_API_BASE_URL is build-time (Docker build arg) and
# API_SECRET is a Secret, so neither belongs here.
configMapGenerator:
  - name: nextjs-app-config
    literals:
      # app/page.js:7 (default "Hello"); value from .env.example:2.
      - GREETING=Hello
# secret.example.yaml is NOT listed: in prod, create the Secret out-of-band;
# in dev, use a secretGenerator with fake values in overlays/dev.
