apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-multiservice-api
  labels:
    app.kubernetes.io/name: go-multiservice-api
    app.kubernetes.io/component: web
spec:
  # No `replicas` here on purpose: dev runs the default (1) and in prod the HPA owns
  # the count. Setting it would reset autoscaling on every `kubectl apply`.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: go-multiservice-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-multiservice-api
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: go-multiservice
      automountServiceAccountToken: false
      # preStop 5s + srv.Shutdown timeout 10s (cmd/api/main.go:88-90) < 30s.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # Must match the image's numeric USER. 10001 matches assets/dockerfiles/*;
        # images with their own user differ (Rails 1000, .NET 1654) — see stacks/.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: go-multiservice-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # DATABASE_URL (cmd/api/main.go:23). Secret: compose inlines a password
            # in it (docker-compose.yml:14).
            - secretRef:
                name: go-multiservice-db
          env:
            # cmd/api/main.go:43-46 (default 8080). Compose hard-codes 9090
            # (docker-compose.yml:11,13); we use the code default and set it explicitly
            # so containerPort, probes and the server always agree.
            - name: PORT
              value: "8080"
            # stacks/go.md: ~90% of the memory limit.
            - name: GOMEMLIMIT
              value: "230MiB"
          # /healthz (cmd/api/main.go:49-52) never touches the DB; liveness stays TCP.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Give load balancers time to drop the endpoint before SIGTERM.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m        # stacks/go.md starting point; assumption
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
