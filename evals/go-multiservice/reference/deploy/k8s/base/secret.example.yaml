# Template only — never commit real values. Create with:
#   kubectl -n go-multiservice create secret generic go-multiservice-db \
#     --from-literal=DATABASE_URL='postgres://<user>:<pw>@<host>:5432/<db>?sslmode=require'
# or use External Secrets / Sealed Secrets / SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: go-multiservice-db
type: Opaque
stringData:
  # Managed Postgres; used by the api, the worker and the migrate Job.
  DATABASE_URL: "<set-me>"
