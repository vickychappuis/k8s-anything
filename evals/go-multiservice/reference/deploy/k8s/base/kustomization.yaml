# Generated by k8sa-scaffold (app=go-multiservice port=8080 health=/healthz), then
# split into one workload per binary (cmd/api, cmd/worker) + a migration Job.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Selectors are explicit in each resource (app.kubernetes.io/name) and never touched
# by these common labels: selectors are immutable, so changing a label here later
# must not break `kubectl apply`.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: go-multiservice
      app.kubernetes.io/managed-by: k8s-anything
resources:
  - serviceaccount.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployment.yaml
  - migrate-job.yaml
# Only config the code reads. Compose's LOG_LEVEL (docker-compose.yml:25) is never
# read and is not shipped. PORT is set on the api container directly.
configMapGenerator:
  - name: go-multiservice-worker-config
    literals:
      - POLL_INTERVAL=2s   # cmd/worker/main.go:22-23; compose value docker-compose.yml:24
# DATABASE_URL lives in the Secret go-multiservice-db (api, worker, migrate).
# secret.example.yaml is NOT listed: in prod, create the Secret out-of-band;
# in dev, overlays/dev has a secretGenerator with fake values.
