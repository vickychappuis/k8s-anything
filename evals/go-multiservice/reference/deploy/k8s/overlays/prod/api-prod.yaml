# Replica count is owned by hpa.yaml (minReplicas). Don't set `replicas` here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-multiservice-api
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: go-multiservice-api
          matchLabelKeys: ["pod-template-hash"]
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: go-multiservice-api
          matchLabelKeys: ["pod-template-hash"]
