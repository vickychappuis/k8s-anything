# Gateway API route. Requires a Gateway in the cluster; set its name/namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-multiservice-api
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
  hostnames:
    - api.go-multiservice.example.com
  rules:
    - backendRefs:
        - name: go-multiservice-api
          port: 80
