apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: go-multiservice
resources:
  - namespace.yaml
  - ../../base
  - api-pdb.yaml
  - worker-pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
  # Public route for the api only (the worker has no port). Gateway API (preferred);
  # Gateway name/namespace and hostname are placeholders (open questions in K8S_REPORT.md).
  - httproute.yaml
  # (Ingress alternative: see assets/kustomize/overlays/prod/ingress.yaml in k8s-anything)
# Base labels don't reach overlay-only resources (PDB, HPA, policies); repeat them.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: go-multiservice
      app.kubernetes.io/managed-by: k8s-anything
# Pin release tags, ideally also `digest: sha256:...`; never latest. Both images come
# from the same commit, so they share a tag.
images:
  - name: go-multiservice-api
    newName: registry.example.com/go-multiservice-api
    newTag: "0.1.0"
  - name: go-multiservice-worker
    newName: registry.example.com/go-multiservice-worker
    newTag: "0.1.0"
patches:
  - path: api-prod.yaml
  - path: worker-prod.yaml
# DATABASE_URL comes from the Secret go-multiservice-db, created out-of-band in this
# namespace and pointing at a managed Postgres (see base/secret.example.yaml).
