# Gateway API route. Requires a Gateway in the cluster; set its name/namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: django-celery
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
  hostnames:
    - django-celery.example.com
  rules:
    - backendRefs:
        - name: django-celery
          port: 80
