apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: django-celery
resources:
  - namespace.yaml
  - ../../base
  - pdb.yaml
  - hpa.yaml            # web only. Never for beat (singleton).
  - networkpolicy.yaml
  # Public route: Gateway API. Gateway name/namespace and hostname are placeholders
  # (open questions in K8S_REPORT.md).
  - httproute.yaml
# Base labels don't reach overlay-only resources (PDB, HPA, policies); repeat them.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: django-celery
      app.kubernetes.io/managed-by: k8s-anything
images:
  - name: django-celery
    newName: registry.example.com/django-celery
    newTag: "0.1.0"   # pin a release tag, ideally also `digest: sha256:...`; never latest
configMapGenerator:
  - name: django-celery-config
    behavior: merge
    literals:
      # Keep localhost (probe Host header) and the Service name; add the public host.
      - ALLOWED_HOSTS=localhost,django-celery,django-celery.example.com
patches:
  - path: deployment-prod.yaml
  - path: worker-prod.yaml
# SECRET_KEY, DATABASE_URL, REDIS_URL come from the Secret django-celery-secrets,
# created out-of-band in this namespace (see base/secret.example.yaml).
