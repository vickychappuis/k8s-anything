# Template only — never commit real values. Create with:
#   kubectl create secret generic django-celery-secrets --from-env-file=.env.prod
# or use External Secrets / Sealed Secrets / SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: django-celery-secrets
type: Opaque
stringData:
  # mysite/settings.py:5 — long random string, e.g. python -c "import secrets; print(secrets.token_urlsafe(50))"
  SECRET_KEY: "<set-me>"
  # mysite/settings.py:15 — managed Postgres, e.g. postgres://<user>:<pw>@<host>:5432/<db>?sslmode=require
  DATABASE_URL: "<set-me>"
  # mysite/settings.py:19 (Celery broker) — managed Redis, e.g. rediss://:<pw>@<host>:6380/0
  REDIS_URL: "<set-me>"
