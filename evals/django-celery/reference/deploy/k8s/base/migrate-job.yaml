# Procfile:4 `release: python manage.py migrate --noinput` → a Job, not an
# initContainer: with several web replicas an initContainer would run migrate
# concurrently from every pod. A Job's pod template is immutable, so the Job deletes
# itself after it finishes (ttlSecondsAfterFinished) and the next `kubectl apply`
# recreates it with the new image. Run it before rolling out a release that needs
# the new schema (see K8S_REPORT.md "Deploy").
apiVersion: batch/v1
kind: Job
metadata:
  name: django-celery-migrate
  labels:
    app.kubernetes.io/name: django-celery-migrate
    app.kubernetes.io/component: migrations
  annotations:
    ignore-check.kube-linter.io/no-readiness-probe: "run-to-completion Job: readiness doesn't apply"
spec:
  backoffLimit: 6          # retries while the database is still starting
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django-celery-migrate
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: django-celery
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: django-celery
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: django-celery-config
            - secretRef:
                name: django-celery-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
