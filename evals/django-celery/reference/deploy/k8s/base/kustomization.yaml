# Generated by k8sa-scaffold (app=django-celery port=8000 health=/healthz), then
# polished: one workload per Procfile process type (web, worker, beat, release).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Selectors are explicit in each resource (app.kubernetes.io/name) and never touched
# by these common labels: selectors are immutable, so changing a label here later
# must not break `kubectl apply`.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: django-celery
      app.kubernetes.io/managed-by: k8s-anything
resources:
  - serviceaccount.yaml
  - deployment.yaml     # web      (Procfile:1)
  - service.yaml
  - worker.yaml         # worker   (Procfile:2)
  - beat.yaml           # beat     (Procfile:3), singleton
  - migrate-job.yaml    # release  (Procfile:4)
# Only config the app reads (mysite/settings.py). Secrets are in django-celery-secrets.
configMapGenerator:
  - name: django-celery-config
    literals:
      # settings.py:6 defaults DEBUG to True when unset: always set it explicitly.
      - DEBUG=False
      # settings.py:7. `localhost` matches the probes' Host header (deployment.yaml);
      # `django-celery` is the in-cluster Service name. Overlays add public hostnames.
      - ALLOWED_HOSTS=localhost,django-celery
      # gunicorn workers, sized to the 100m CPU request (stacks/python.md); assumption.
      - WEB_CONCURRENCY=2
# secret.example.yaml is NOT listed: in prod, create the Secret out-of-band;
# in dev, use a secretGenerator with fake values in overlays/dev.
