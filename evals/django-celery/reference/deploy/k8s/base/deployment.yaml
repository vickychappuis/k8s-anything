# Procfile:1 `web: gunicorn mysite.wsgi --log-file -` (the image's default CMD).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-celery
  labels:
    app.kubernetes.io/name: django-celery
    app.kubernetes.io/component: web
spec:
  # No `replicas` here on purpose: dev runs the default (1) and in prod the HPA owns
  # the count. Setting it would reset autoscaling on every `kubectl apply`.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: django-celery
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django-celery
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: django-celery
      automountServiceAccountToken: false
      # preStop 5s + gunicorn's 30s --graceful-timeout for in-flight requests.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: django-celery
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: django-celery-config
            # SECRET_KEY, DATABASE_URL, REDIS_URL (mysite/settings.py:5,15,19).
            - secretRef:
                name: django-celery-secrets
          env:
            # Dockerfile CMD; gunicorn binds 0.0.0.0:$PORT.
            - name: PORT
              value: "8000"
          # /healthz (mysite/urls.py:12-13) touches no dependency. kubelet sends the pod
          # IP as Host, which Django rejects with 400 (DisallowedHost, verified) unless
          # it's in ALLOWED_HOSTS; send a Host that is (base ConfigMap) instead of `*`.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Give load balancers time to drop the endpoint before SIGTERM.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi   # stacks/python.md starting point (gunicorn, 2 workers); assumption
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
