# Generated by k8sa-scaffold (app=flask-redis port=5000 health=/healthz), then polished.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Selectors are explicit in each resource (app.kubernetes.io/name) and never touched
# by these common labels: selectors are immutable, so changing a label here later
# must not break `kubectl apply`.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: flask-redis
      app.kubernetes.io/managed-by: k8s-anything
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
# Only config the app or its server actually reads. Compose's SECRET_KEY is never
# read by app.py and is deliberately not shipped (see K8S_REPORT.md).
configMapGenerator:
  - name: flask-redis-config
    literals:
      # gunicorn workers, sized to the 100m CPU request (stacks/python.md); assumption.
      - WEB_CONCURRENCY=2
# secret.example.yaml is NOT listed: in prod, create the Secret out-of-band;
# in dev, use a secretGenerator with fake values in overlays/dev.
