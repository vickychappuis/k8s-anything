# Gateway API route. Requires a Gateway in the cluster; set its name/namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flask-redis
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
  hostnames:
    - flask-redis.example.com
  rules:
    - backendRefs:
        - name: flask-redis
          port: 80
